plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.fixture'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.example.fixture"
        minSdk rootProject.ext.minSdkVersion
        targetSdk 34
        versionCode 7
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_URL", "\"https://CANARY_BUILDCONFIG\""
    }

    signingConfigs {
        release {
            keyAlias 'CANARY_ALIAS'
            keyPassword 'CANARY_KEY_PASSWORD'
            storeFile file('../release.jks')
            storePassword "CANARY_STORE_PASSWORD"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation project(':core')
    implementation(project(":features:home"))
    implementation "androidx.core:core-ktx:${coreKtxVersion}"
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    def token = "CANARY_DEF_TOKEN"
}
